<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH Shell</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0e0e10;
        color: #e6e6e6;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      #boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 4px;
        padding: 0 32px;
        text-align: center;
      }
      .spinner {
        width: 30px;
        height: 30px;
        border: 3px solid rgba(255, 255, 255, 0.14);
        border-top-color: #6ee7b7;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 18px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      #status {
        font-size: 15px;
        font-weight: 600;
      }
      #detail {
        font-size: 12.5px;
        line-height: 1.6;
        opacity: 0.72;
        max-width: 640px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-family: "Cascadia Mono", Consolas, monospace;
      }
      #hint {
        margin-top: 20px;
        font-size: 11.5px;
        opacity: 0.45;
      }
      body.failed .spinner { animation: none; border-top-color: #f87171; opacity: 0.5; }
      body.failed #status { color: #f87171; }
    </style>
  </head>
  <body>
    <!-- Shown from window creation until dsh prints its authenticated URL, and
         reused to report a startup failure. The WebView is then navigated to
         the dsh origin, so this page is never the end state. -->
    <div id="boot">
      <div class="spinner"></div>
      <p id="status">Starting dsh&hellip;</p>
      <p id="detail">Waiting for dsh to publish its web endpoint.</p>
      <p id="hint">Full details: %APPDATA%\deepseek\dsh-shell\data\logs\dsh-shell.log</p>
    </div>
  </body>
</html>
