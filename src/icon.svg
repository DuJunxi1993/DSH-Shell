<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="plate-clip">
      <rect x="64" y="64" width="896" height="896" rx="196"/>
    </clipPath>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a21"/>
      <stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8affd6"/>
      <stop offset="0.55" stop-color="#34d3a8"/>
      <stop offset="1" stop-color="#128f74"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- plate: the dark window chrome the shell is -->
  <rect x="64" y="64" width="896" height="896" rx="196" fill="url(#plate)"/>

  <!-- the D: a terminal chevron turning into a ring, i.e. dsh web in one mark -->
  <g fill="none" stroke="url(#sheen)" stroke-width="86"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M356 300 L236 512 L356 724"/>
    <path d="M512 300 A212 212 0 1 1 512 724"/>
  </g>

  <!-- sheen across the top third, so the mark reads as glass not plastic.
       Clipped to the plate so it cannot escape the rounded corners. -->
  <g clip-path="url(#plate-clip)">
    <rect x="64" y="64" width="896" height="400" fill="url(#glass)"/>
  </g>

  <rect x="64.5" y="64.5" width="895" height="895" rx="195.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>
</svg>
