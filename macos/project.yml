name: DSHShell
options:
  bundleIdPrefix: ai.deepseek
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEAD_CODE_STRIPPING: YES
    # Ad-hoc signed (no development team). Hardened Runtime would enable
    # library validation, which requires the embedded DSHShellCore.framework
    # to be signed by the same team as the app; ad-hoc signatures have no
    # Team ID, so dyld rejects the framework ("different Team IDs") and the
    # app aborts at launch. Only meaningful with a real signing identity.
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    PRODUCT_NAME: DSHShell
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.2"
configs:
  Debug: debug
  Release: release
targets:
  DSHShellCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/DSHShellCore
    info:
      path: App/DSHShellCore/Info.plist
      properties:
        CFBundleName: DSHShellCore
        CFBundleIdentifier: ai.deepseek.dsh-shell.core
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
    settings:
      base:
        PRODUCT_NAME: DSHShellCore
        PRODUCT_BUNDLE_IDENTIFIER: ai.deepseek.dsh-shell.core
        DEFINES_MODULE: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        SKIP_INSTALL: YES
        INSTALL_PATH: "@rpath"
  DSHShellBridge:
    type: framework
    platform: macOS
    sources:
      - path: Sources/DSHShellBridge/include/DSHShellBridge.h
        buildPhase: headers
        attributes:
          Public: true
      - path: Sources/DSHShellBridge/DSHObjCWebUIDelegate.m
      - path: Sources/DSHShellBridge/include/DSHObjCWebUIDelegate.h
        buildPhase: headers
        attributes:
          Public: true
    info:
      path: App/DSHShellBridge/Info.plist
      properties:
        CFBundleName: DSHShellBridge
        CFBundleIdentifier: ai.deepseek.dsh-shell.bridge
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundlePackageType: FMWK
        CFBundleExecutable: DSHShellBridge
    settings:
      base:
        PRODUCT_NAME: DSHShellBridge
        PRODUCT_BUNDLE_IDENTIFIER: ai.deepseek.dsh-shell.bridge
        DEFINES_MODULE: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        SKIP_INSTALL: YES
        INSTALL_PATH: "@rpath"
        CLANG_ENABLE_MODULES: YES
        MODULEMAP_FILE: ""
        OTHER_MODULEMAP_FLAGS: ""
  DSHShell:
    type: application
    platform: macOS
    sources:
      - path: Sources/DSHShell
      - path: Sources/DSHShell/Bridge/bridge.js
        buildPhase: resources
      - path: App/DSHShell/AppIcon.icns
        buildPhase: resources
    dependencies:
      - target: DSHShellCore
      - target: DSHShellBridge
    info:
      path: App/DSHShell/Info.plist
      properties:
        CFBundleName: dsh
        CFBundleDisplayName: dsh
        CFBundleIdentifier: ai.deepseek.dsh-shell
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 dsh-swiftUI contributors"
        NSPrincipalClass: NSApplication
        NSMainStoryboardFile: ""
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.developer-tools
    entitlements:
      path: App/DSHShell/DSHShell.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.inherit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.deepseek.dsh-shell
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 dsh-swiftUI contributors"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/DSHShell/DSHShell-Bridging-Header.h
        CLANG_ENABLE_MODULES: YES
schemes:
  DSHShell:
    build:
      targets:
        DSHShell: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
