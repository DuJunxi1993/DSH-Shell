[package]
name = "dsh-shell"
version = "0.1.1"
description = "A native desktop shell for the DeepSeek Harness (dsh) web UI"
authors = ["DuJunxi1993"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dsh_shell_core"
path = "src/lib.rs"

[[bin]]
name = "dsh-shell"
path = "src/main.rs"

# Test double for `dsh web`. Never bundled, never launched outside `cargo test`.
# See AGENTS.md rule 2.
[[bin]]
name = "stub-dsh"
path = "src/bin/stub-dsh.rs"
test = false
bench = false
doc = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2.x. `tray-icon` is not in tauri's default feature set; the window has
# no native caption, so the tray is the only way out once it is hidden.
tauri = { version = "2", features = ["tray-icon"] }

# A second launch must raise the window that is already running rather than
# start a rival one. Uses a named mutex on Windows, so the activation happens
# inside the first process and is not blocked by the foreground lock.
tauri-plugin-single-instance = "2.5"

# Opens http(s) links in the system default browser instead of navigating the
# app's own webview away from dsh.
tauri-plugin-opener = "2.5"

# Async runtime (bundled with Tauri, but explicit for clarity)
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread"] }

# HTTP probing for fallback URL discovery
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
tracing-appender = "0.2"

# Config / IO
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
thiserror = "1"

# Utilities
once_cell = "1"
parking_lot = "0.12"
regex = "1"
url = "2"
tauri-plugin-notification = "2.3.3"

# The plugin shows a toast and drops the handle, which kills the WinRT
# activation handler: clicking the toast is swallowed. The shell's own toasts go
# through notify-rust directly so the handle survives and a click can be received.
# Windows-only; see src/toast.rs.
[target.'cfg(windows)'.dependencies]
notify-rust = "4"

# Orphan detection needs to answer two questions about a process it did not
# spawn: who is that process's parent, and what is its executable. Both come from
# the process table, and `preflight` decides whether to kill on the answers, so
# they are pinned to the narrowest features that provide them. See src/orphan.rs.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread", "process"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# `panic = "abort"` is deliberately NOT set. Abort skips every `Drop`, which
# would strand a live dsh holding the port with no window left to close it —
# the one outcome this whole app exists to prevent.
