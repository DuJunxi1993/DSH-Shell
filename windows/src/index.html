<!DOCTYPE html>
<!--
  data-dsh-shell-placeholder marks this as the shell's own boot page. The injected
  chrome uses it to make room for the title bar here and *only* here: the dsh page
  itself must reach the top edge of the window.
-->
<html lang="en" data-dsh-shell-placeholder>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH Shell</title>
    <style>
      :root {
        color-scheme: dark;
        /* The injected chrome reads these two to match the surface and
           foreground of whichever page it is in. The dsh web app defines them
           for its own theme; this page has to declare its own. */
        --dsw-alias-bg-base: #0e0e10;
        --dsw-alias-label-primary: #e6e6e6;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0e0e10;
        color: #e6e6e6;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      #boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 4px;
        padding: 0 32px;
        text-align: center;
      }
      .spinner {
        width: 30px;
        height: 30px;
        border: 3px solid rgba(255, 255, 255, 0.14);
        border-top-color: #6ee7b7;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 18px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      #status {
        font-size: 15px;
        font-weight: 600;
      }
      #detail {
        font-size: 12.5px;
        line-height: 1.6;
        opacity: 0.72;
        max-width: 640px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-family: "Cascadia Mono", Consolas, monospace;
      }
      #hint {
        margin-top: 20px;
        font-size: 11.5px;
        opacity: 0.45;
      }
      body.failed .spinner { animation: none; border-top-color: #f87171; opacity: 0.5; }
      body.failed #status { color: #f87171; }

      /* The failure panel. Separate from the centred column above because a
         refusal has to show *evidence* - the PID and the command line of whatever
         holds our port - and a centred single column cannot hold a legible
         command line without wrapping it into noise. */
      #failure {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        padding: 0 32px;
        overflow-y: auto;
      }
      body.failed #boot { display: none; }
      body.failed #failure { display: flex; }
      #failure .panel {
        width: 100%;
        max-width: 720px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      #failure h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: #f87171;
      }
      #failure .reason {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.6;
        opacity: 0.82;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-family: "Cascadia Mono", Consolas, monospace;
      }
      #occupants {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #occupants:empty { display: none; }
      #occupants .caption {
        font-size: 11.5px;
        opacity: 0.5;
      }
      #occupants li {
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        background: rgba(255, 255, 255, 0.03);
      }
      #occupants .pid {
        font-size: 12.5px;
        font-weight: 600;
        font-family: "Cascadia Mono", Consolas, monospace;
      }
      #occupants .verdict { font-size: 11.5px; line-height: 1.55; opacity: 0.7; }
      #occupants .cmd {
        font-size: 11px;
        line-height: 1.5;
        opacity: 0.6;
        font-family: "Cascadia Mono", Consolas, monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        /* Long npm paths are the norm here; without a cap one entry pushes every
           other occupant off the panel. */
        max-height: 4.5em;
        overflow-y: auto;
      }
      #occupants li.reclaimable { border-color: rgba(110, 231, 183, 0.35); }
      #actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        /* Below the evidence, not above it: the decision to end somebody's
           process should be made after reading what the process is. */
        margin-top: 4px;
      }
      #actions button {
        font: inherit;
        font-size: 12.5px;
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.06);
        color: #e6e6e6;
        cursor: pointer;
      }
      #actions button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }
      #actions button:disabled { opacity: 0.45; cursor: default; }
      #actions button.primary {
        border-color: rgba(110, 231, 183, 0.4);
        background: rgba(110, 231, 183, 0.12);
      }
      /* While a retry is in flight the buttons must not answer a second click:
         each one re-spawns dsh, and two lifecycle loops would race for the port
         that caused the failure in the first place. */
      body.busy #actions { opacity: 0.5; }
    </style>
  </head>
  <body>
    <!-- Shown from window creation until dsh prints its authenticated URL, and
         reused to report a startup failure. The WebView is then navigated to
         the dsh origin, so this page is never the end state. -->
    <div id="boot">
      <div class="spinner"></div>
      <p id="status">Starting dsh&hellip;</p>
      <p id="detail">Waiting for dsh to publish its web endpoint.</p>
      <p id="hint">Full details: %APPDATA%\deepseek\dsh-shell\data\logs\dsh-shell.log</p>
    </div>

    <!-- The failure screen. Populated by `startup_failure` from Rust rather than
         built here, so the evidence on it is the same evidence the log records -
         one source, so the page cannot disagree with the diagnosis.
         `window.__DSH_SHELL_FAILURE__` is read by `report_failure` to decide
         which buttons make sense. -->
    <div id="failure">
      <div class="panel">
        <h1>Failed to start dsh</h1>
        <p class="reason" id="failure-reason"></p>
        <ul id="occupants"></ul>
        <div id="actions">
          <button id="retry" type="button" class="primary">Retry</button>
          <button id="cleanup" type="button">Close leftovers and retry</button>
        </div>
        <p id="hint">Full details: %APPDATA%\deepseek\dsh-shell\data\logs\dsh-shell.log</p>
      </div>
    </div>

    <script>
      /* Our own origin, so this is not subject to dsh's CSP - it never loads
         here, because the WebView is navigated away to dsh as soon as dsh is
         up. `withGlobalTauri` is off, so the bridge is the internals object,
         with the global API kept as a fallback. */
      (function () {
        var internals = window.__TAURI_INTERNALS__;

        function invoke(cmd, args) {
          var api = internals && internals.invoke
            ? internals.invoke
            : (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke);
          if (!api) {
            return Promise.reject(new Error("no Tauri bridge"));
          }
          return api(cmd, args);
        }

        var buttons = {
          retry: document.getElementById("retry"),
          cleanup: document.getElementById("cleanup")
        };

        /* Reset to the starting state.
         *
         * `body.failed` alone would leave the panel populated, and a retry that
         * fails differently would then show the previous launch's occupant: a
         * stale PID on screen is worse than no evidence at all, because it looks
         * current. */
        function reset(message) {
          document.body.classList.remove("failed", "busy");
          var occupants = document.getElementById("occupants");
          if (occupants) occupants.textContent = "";
          var reason = document.getElementById("failure-reason");
          if (reason) reason.textContent = "";
          var status = document.getElementById("status");
          if (status) status.textContent = message || "Starting dsh…";
          var detail = document.getElementById("detail");
          if (detail) detail.textContent = "Waiting for dsh to publish its web endpoint.";
          window.__DSH_SHELL_FAILURE__ = null;
        }

        function busy(on) {
          document.body.classList.toggle("busy", !!on);
          Object.keys(buttons).forEach(function (name) {
            if (buttons[name]) buttons[name].disabled = !!on;
          });
        }

        /* Render the occupant list from what Rust decided.
         *
         * Built with `createElement` and `textContent`, never `innerHTML`: one of
         * the fields is a process command line, which is attacker-influenced
         * input on any machine where something else owns the port. */
        function renderOccupants(data) {
          var list = document.getElementById("occupants");
          if (!list) return;
          list.textContent = "";
          var people = (data && data.occupants) || [];
          if (!people.length) return;

          var caption = document.createElement("div");
          caption.className = "caption";
          caption.textContent = people.length === 1
            ? "1 process is holding this port"
            : people.length + " processes are holding this port";
          list.appendChild(caption);

          people.forEach(function (person) {
            var item = document.createElement("li");
            if (person.reclaimable) item.className = "reclaimable";

            var pid = document.createElement("div");
            pid.className = "pid";
            pid.textContent = "PID " + person.pid + (person.reclaimable ? "  ·  ours, orphaned" : "");
            item.appendChild(pid);

            if (person.verdict) {
              var verdict = document.createElement("div");
              verdict.className = "verdict";
              verdict.textContent = person.verdict;
              item.appendChild(verdict);
            }
            if (person.command_line) {
              var cmd = document.createElement("div");
              cmd.className = "cmd";
              cmd.textContent = person.command_line;
              item.appendChild(cmd);
            }
            list.appendChild(item);
          });
        }

        /* Called from Rust via `eval`, so it has to be reachable from the global
         * scope rather than closed over here. */
        window.__DSH_SHELL_SHOW_FAILURE__ = function (payload) {
          var data = typeof payload === "string" ? JSON.parse(payload) : payload;
          var reason = document.getElementById("failure-reason");
          if (reason) reason.textContent = (data && data.reason) || "unknown error";
          renderOccupants(data);

          /* Only offer to close processes there are some to close. A button
           * labelled "close leftovers" on a screen showing no leftovers is a
           * lie, and pressing it would run a reclaim for nothing. */
          var anyReclaimable = ((data && data.occupants) || []).some(function (person) {
            return person.reclaimable;
          });
          if (buttons.cleanup) buttons.cleanup.hidden = !anyReclaimable;

          window.__DSH_SHELL_FAILURE__ = data || null;
          document.body.classList.add("failed");
        };

        function start(cleanup) {
          if (document.body.classList.contains("busy")) return;
          busy(true);
          reset("Starting dsh…");
          document.body.classList.add("failed");
          document.getElementById("status").textContent = cleanup
            ? "Closing leftovers and starting dsh…"
            : "Starting dsh…";
          invoke("startup_retry", { cleanup: !!cleanup }).catch(function (error) {
            busy(false);
            document.body.classList.remove("failed");
            document.getElementById("detail").textContent = "retry failed: " + error;
            document.body.classList.add("failed");
            document.getElementById("status").textContent = "Failed to start dsh";
          });
        }

        if (buttons.retry) buttons.retry.addEventListener("click", function () { start(false); });
        if (buttons.cleanup) buttons.cleanup.addEventListener("click", function () { start(true); });

        /* Rust drives the reset too, so the boot page can be returned to its
         * starting state without a reload. */
        window.__DSH_SHELL_RESET_BOOT__ = reset;
      })();
    </script>
  </body>
</html>
